          { id: 19, source: "Q064-3", question: "A学会におけるバナー広告の依頼を受けました。紙媒体は作成せず、学会員専用Web上のプログラムにてバナー広告を掲示するものです。広告期間5カ月、掲載料金10万円です。応募できますか。", options: ["応募できる", "応募できない"], correctAnswer: 0, explanation: "応募することができます。ただし、学会等におけるバナー広告については、その広告料が、社会通念を大幅に超えるものでない相応の対価であることを確認する必要があります。" },
          { id: 20, source: "Q065-1", question: "災害が発生し担当先の多くの医療機関が被災しました。そこで担当先の医療機関等で散乱物の後片付け等、支援活動を行いたいのですが、過大な労務提供として規約違反に問われることはないでしょうか。", options: ["規約違反に問われることはない", "規約違反になるため実施できない"], correctAnswer: 0, explanation: "災害復旧のための労務提供は、義援金、見舞金、水等の援助物資と同様、医療用医薬品の取引に付随しないものとして扱うため、規約上の制限を受けません。" },
          { id: 21, source: "Q065-2", question: "A大学病院の機関誌（200部発行予定）への広告依頼がありました。広告料募集総額は90万円、媒体作成諸費用は100万円（印刷費90万＋郵送料10万）です。このような広告に応募できるでしょうか。", options: ["応募できる", "応募できない"], correctAnswer: 0, explanation: "広告料の総額が媒体作成費用の範囲内であり、個人費用の指標を満たしているなど相応の広告料であると判断できれば応募できます。" },
          { id: 22, source: "Q066-1", question: "旭川医科大学病院の先生の身分はどれに該当しますか？", options: ["公務員", "みなし公務員", "民間人"], correctAnswer: 1, explanation: "開設者は「国立大学法人」です。法人の職員となるため「みなし公務員」になります。" },
          { id: 23, source: "Q066-1", question: "岩手医科大学附属病院の先生の身分はどれに該当しますか？", options: ["公務員", "みなし公務員", "民間人"], correctAnswer: 2, explanation: "開設者は「学校法人」です。法人の職員となるため「民間」になります。" },
          { id: 24, source: "Q066-1", question: "防衛医科大学校病院の先生の身分はどれに該当しますか？", options: ["公務員", "みなし公務員", "民間人"], correctAnswer: 0, explanation: "開設者は「防衛省」です。防衛省の中に配置されており、その職員となるため「公務員（国家公務員）」になります。" },
          { id: 25, source: "Q066-1", question: "厚生(医療)農業協同組合連合会 上越総合病院の先生の身分はどれに該当しますか？", options: ["公務員", "みなし公務員", "民間人"], correctAnswer: 2, explanation: "開設者は「厚生(医療)農業協同組合連合会」です。その団体の職員となるため「民間」になります。" },
          { id: 26, source: "Q066-1", question: "東京警察病院の先生の身分はどれに該当しますか？", options: ["公務員", "みなし公務員", "民間人"], correctAnswer: 2, explanation: "開設者は「一般財団法人 自警会」です。その団体の職員となるため「民間」になります。" },
          { id: 27, source: "Q066-1", question: "浜松労災病院の先生の身分はどれに該当しますか？", options: ["公務員", "みなし公務員", "民間人"], correctAnswer: 1, explanation: "開設者は「独立行政法人 労働者健康安全機構」です。その団体の職員となるため「みなし公務員」になります。" },
          { id: 28, source: "Q066-1", question: "ＪＣＨＯ大阪病院の先生の身分はどれに該当しますか？", options: ["公務員", "みなし公務員", "民間人"], correctAnswer: 1, explanation: "開設者は「独立行政法人 地域医療機能推進機構」です。その団体の職員となるため「みなし公務員」になります。" },
          { id: 29, source: "Q066-1", question: "富山市立富山市民病院の先生の身分はどれに該当しますか？", options: ["公務員", "みなし公務員", "民間人"], correctAnswer: 0, explanation: "開設者は「富山市」です。地方自治体の職員となるため「公務員（地方公務員）」になります。" },
          { id: 30, source: "Q066-1", question: "川崎市立多摩病院の先生の身分はどれに該当しますか？", options: ["公務員", "みなし公務員", "民間人"], correctAnswer: 2, explanation: "開設者は「学校法人 聖マリアンナ医科大学」です。指定管理者制度に基づき同法人が管理・運営しているため、その職員となり「民間」になります。" },
          { id: 31, source: "Q066-1", question: "広島市立広島市民病院の先生の身分はどれに該当しますか？", options: ["公務員", "みなし公務員", "民間人"], correctAnswer: 1, explanation: "開設者は「一般地方独立行政法人」です。その団体の職員となるため「みなし公務員」になります。" },
          { id: 32, source: "Q066-1", question: "済生会松山病院の先生の身分はどれに該当しますか？", options: ["公務員", "みなし公務員", "民間人"], correctAnswer: 2, explanation: "開設者は「社会福祉法人 恩賜財団」です。その団体の職員となるため「民間」になります。" },
          { id: 33, source: "Q066-1", question: "産業医科大学病院の先生の身分はどれに該当しますか？", options: ["公務員", "みなし公務員", "民間人"], correctAnswer: 2, explanation: "開設者は「学校法人 産業医科大学」です。その団体の職員となるため「民間」になります。" },
          { id: 34, source: "Q066-2", question: "公立大学法人の医学部附属病院の部長に特別講演を依頼しました。交通便が悪いのでタクシーチケットを提供しようと思います。問題ないでしょうか？", options: ["提供して問題ない", "タクシーチケットは金券扱いなので提供できない", "施設規定で認められていれば、事務方に確認して提供して問題ない"], correctAnswer: 2, explanation: "開設者は「公立大学法人」であり「みなし公務員」になります。事業企画申請時において、当該施設の事務方（タクシー利用確認者）に確認し、指定の記載等を行えば提供可能です。" },
          { id: 35, source: "Q066-2", question: "国立病院機構の病院の部長に特別講演（1時間）を依頼しました。謝礼はいくら支払うことができますか？（国立病院機構倫理規程に基づく）", options: ["3万円", "4万円（高度な専門性を有する場合は10万円程度も可）", "依頼することはできない"], correctAnswer: 1, explanation: "国立病院機構倫理規程では講演料等は1時間当たり4万円程度と記載されていますが、医学等に関する高度な専門性を有する場合は10万円程度の受領が可能となっています。" },
          { id: 36, source: "Q066-2", question: "国立病院機構の病院の医師に、自社の社内研修会講師（1時間）を依頼しました。謝礼はいくら支払うことができますか？", options: ["3万円", "4万円", "依頼することはできない"], correctAnswer: 2, explanation: "国立病院機構の倫理規程で、職員が営利企業の社員だけのために講演を行うことは、国民の疑惑や不信を招く恐れがあるため、謝礼を受け取って講演を行うことはできません。" },
          { id: 37, source: "Q066-3", question: "利害関係者について。製薬企業の社員(MR等)は、国立病院機構の医師等にとって利害関係者に該当しますか？", options: ["該当する", "該当しない"], correctAnswer: 0, explanation: "MR等の行為は自社の製品の販売促進等のために病院職員に接触することが多く、病院と契約関係にある医薬品販売業者の利益のための行為（代理行為）を行っていると言わざるを得ないため、利害関係者に該当します。" },
          { id: 38, source: "Q066-3", question: "利害関係者について。医師会は、一般的に国立病院機構の病院職員にとって利害関係者に該当しますか？", options: ["該当する", "該当しない"], correctAnswer: 1, explanation: "医師会ということをもって直ちに利害関係者に該当するものではありません。委託契約がある場合等を除き、通常は利害関係はないと判断されます。" },
          { id: 39, source: "Q066-3", question: "利害関係者について。電気・ガス・水道等の公益事業者、地方自治体等の職員は、国立病院機構の病院職員にとって利害関係者に該当しますか？", options: ["該当する", "該当しない（ただし契約事務担当職員にとっては該当する場合がある）"], correctAnswer: 1, explanation: "電気・ガス・水道等は価格設定等に裁量の余地がほとんどないため除外されています。その他の地方自治体等の職員も直ちに該当しませんが、契約等がある場合は契約担当職員にとって利害関係者になります。" },
          { id: 40, source: "Q066-3", question: "利害関係者について。マスコミ（新聞記者、放送関係者など）は、国立病院機構の病院職員にとって利害関係者に該当しますか？", options: ["該当する", "該当しない（ただし広告契約等がある場合は契約担当職員にとって該当）"], correctAnswer: 1, explanation: "一般にマスコミとの間には契約等利害関係者につながる関係がないと考えられるため該当しません。ただし広告の契約等がある場合は、契約担当職員の利害関係者として取り扱います。" },
          { id: 41, source: "Q066-3", question: "国立病院機構の病院の外科系診療科全体で、昼休み（12:15〜12:45）に製品説明会を実施します。食事時間帯のため、弁当を提供してもよいでしょうか。", options: ["職務内とみなされ、提供できる", "職務外とみなされるため、提供できない"], correctAnswer: 1, explanation: "昼休み（休憩時間）は職務外となるため、利害関係者から無償で弁当の提供を受けることは禁止行為となります。" },
          { id: 42, source: "Q066-3", question: "国立病院機構の病院の部長が、職務外で参加する学会において、ランチョンセミナーで弁当を配布された場合、受け取ることができるでしょうか。", options: ["受け取ることができる", "受け取ることはできない"], correctAnswer: 1, explanation: "職務外で学会に参加する場合、利害関係者から提供される弁当を受け取ることは出来ません。自己の費用を負担して飲食することになります。" },
          { id: 43, source: "Q066-3", question: "国立病院機構の病院の部長が、製薬会社主催の講演会に演者（役割者）として参加しました。講演会終了後、懇親会（立食形式：約30名）に出席できるでしょうか。", options: ["出席できる", "出席できない"], correctAnswer: 0, explanation: "講演会終了後に多数の者が出席する（20人以上）立食パーティーにおいて利害関係者から飲食物の提供を受けることは、倫理規程上、例外として認められています。" },
          { id: 44, source: "Q067-1", question: "団体性が認められるA研究会（学術集会と機関誌を発行）から寄附要請がありました。予算書では個人費用50万円、施設年会費90万円と記載があります。寄附要請に応じてよいでしょうか。", options: ["応じることができる", "応じることはできない"], correctAnswer: 0, explanation: "施設年会費で個人費用が賄われていると判断できる（個人費用の指標を満たしている）ため、寄附金を拠出することが出来ます。" },
          { id: 45, source: "Q067-2", question: "NPO法人の理事であるA先生から寄附を依頼されました。この法人の活動内容は、B病院の受診勧誘に特化したものです。予算書で個人費用に問題はありません。このNPO法人へ寄附できますか。", options: ["寄附できる", "寄附できない"], correctAnswer: 1, explanation: "活動内容が特定の病院の受診勧誘に特化しており、実質的にB病院の通常の医療業務に対する金銭提供となるため、規約で制限され寄附できません。" }
        ];

        // --- 2. アイコンSVG文字列 ---
        const icons = {
            checkCircle: `<svg class="w-5 h-5 text-green-600 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
            xCircle: `<svg class="w-5 h-5 text-red-600 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
            arrowRight: `<svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`,
            arrowLeft: `<svg class="w-4 h-4 mr-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>`,
            rotateCcw: `<svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>`,
            trophy: `<svg class="w-12 h-12 text-blue-600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>`,
            alertCircle: `<svg class="w-6 h-6 text-red-600 mt-0.5 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
            bookOpen: `<svg class="w-6 h-6 text-blue-600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
            checkCircleLg: `<svg class="w-6 h-6 text-green-600 mt-0.5 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
            stethoscope: `<svg class="w-8 h-8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg>`,
            scale: `<svg class="w-8 h-8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>`
        };

        // --- 3. 状態管理変数 ---
        let currentView = 'menu'; // 'menu' または 'quiz'
        let activeQuizData = [];
        let activeQuizTitle = "";
        
        // クイズ進行用ステート
        let currentQuestion = 0;
        let score = 0;
        let scoreAtBlockStart = 0;
        let showResult = false;
        let showIntermediate = false;
        let selectedOption = null;
        let isAnswered = false;

        // --- 4. 共通ロジック ---
        window.startQuiz = function(type) {
            if (type === 'oplus') {
                activeQuizData = oplusQuizData;
                activeQuizTitle = "2026OPLUS確認テスト";
            } else if (type === 'compliance') {
                activeQuizData = complianceQuizData;
                activeQuizTitle = "コンプライアンス確認テスト";
            }
            
            // クイズ状態の初期化
            currentQuestion = 0;
            score = 0;
            scoreAtBlockStart = 0;
            showResult = false;
            showIntermediate = false;
            selectedOption = null;
            isAnswered = false;
            currentView = 'quiz';
            
            render();
        };

        window.backToMenu = function() {
            if (!showResult && !showIntermediate && currentQuestion > 0) {
                const confirmLeave = confirm("テストの途中ですが、メニューに戻りますか？\n（進捗はリセットされます）");
                if (!confirmLeave) return;
            }
            currentView = 'menu';
            render();
        };

        function getOptionStyle(index) {
            if (!isAnswered) {
                return "bg-white border-gray-300 hover:border-blue-500 hover:bg-blue-50 text-gray-700 cursor-pointer";
            }
            
            const isCorrectOption = index === activeQuizData[currentQuestion].correctAnswer;
            const isSelectedOption = index === selectedOption;

            if (isCorrectOption) {
                return "bg-green-100 border-green-500 text-green-800 shadow-sm";
            }
            if (isSelectedOption && !isCorrectOption) {
                return "bg-red-100 border-red-500 text-red-800 shadow-sm";
            }
            
            return "bg-gray-50 border-gray-200 text-gray-400 opacity-60 cursor-not-allowed";
        }

        // --- 5. クイズアクションハンドラ ---
        window.handleOptionClick = function(index) {
            if (isAnswered) return;
            
            selectedOption = index;
            isAnswered = true;
            
            if (index === activeQuizData[currentQuestion].correctAnswer) {
                score++;
            }
            
            render();
        };

        window.handleNextQuestion = function() {
            if (currentQuestion < activeQuizData.length - 1) {
                // 10問ごとの区切り判定
                if ((currentQuestion + 1) % 10 === 0) {
                    showIntermediate = true;
                } else {
                    currentQuestion++;
                    selectedOption = null;
                    isAnswered = false;
                }
            } else {
                showResult = true;
            }
            render();
        };

        window.continueQuiz = function() {
            showIntermediate = false;
            currentQuestion++;
            scoreAtBlockStart = score;
            selectedOption = null;
            isAnswered = false;
            render();
        };

        window.redoCurrentBlock = function() {
            showIntermediate = false;
            currentQuestion = Math.floor(currentQuestion / 10) * 10;
            score = scoreAtBlockStart;
            selectedOption = null;
            isAnswered = false;
            render();
        };

        window.restartQuiz = function() {
            currentQuestion = 0;
            score = 0;
            scoreAtBlockStart = 0;
            showResult = false;
            showIntermediate = false;
            selectedOption = null;
            isAnswered = false;
            render();
        };

        // --- 6. 描画ロジック ---
        function render() {
            const app = document.getElementById('app');

            if (currentView === 'menu') {
                app.innerHTML = `
                    <div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                        <div class="max-w-4xl w-full animate-fade-in">
                            <div class="text-center mb-12">
                                <h1 class="text-4xl font-extrabold text-gray-900 mb-4 tracking-tight">確認テストポータル</h1>
                                <p class="text-gray-500 text-lg">受講するテストを選択して開始してください。</p>
                            </div>
                            
                            <div class="grid md:grid-cols-2 gap-6">
                                <!-- OPLUS Card -->
                                <button onclick="startQuiz('oplus')" class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 p-8 text-left group border border-gray-100 hover:border-blue-400">
                                    <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 group-hover:bg-blue-600 group-hover:text-white transition-all">
                                        ${icons.stethoscope}
                                    </div>
                                    <h2 class="text-2xl font-bold text-gray-800 mb-2">2026OPLUS確認テスト</h2>
                                    <p class="text-gray-500 mb-6 line-clamp-2 text-sm">栄養管理、リアルワールドデータ、各種疾患・治療などに関する総合的な確認テストです。</p>
                                    
                                    <div class="flex items-center justify-between border-t border-gray-50 pt-4 mt-auto">
                                        <span class="inline-flex items-center gap-1.5 py-1 px-3 rounded-md bg-gray-100 text-gray-600 text-sm font-medium">
                                            全75問
                                        </span>
                                        <span class="flex items-center text-blue-600 font-bold group-hover:translate-x-1 transition-transform">
                                            開始する <span class="ml-1">${icons.arrowRight}</span>
                                        </span>
                                    </div>
                                </button>
                                
                                <!-- Compliance Card -->
                                <button onclick="startQuiz('compliance')" class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 p-8 text-left group border border-gray-100 hover:border-indigo-400">
                                    <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 group-hover:bg-indigo-600 group-hover:text-white transition-all">
                                        ${icons.scale}
                                    </div>
                                    <h2 class="text-2xl font-bold text-gray-800 mb-2">コンプライアンス確認テスト</h2>
                                    <p class="text-gray-500 mb-6 line-clamp-2 text-sm">プロモーションコード、医療機関等への資金提供、寄附などのルールに関する確認テストです。</p>
                                    
                                    <div class="flex items-center justify-between border-t border-gray-50 pt-4 mt-auto">
                                        <span class="inline-flex items-center gap-1.5 py-1 px-3 rounded-md bg-gray-100 text-gray-600 text-sm font-medium">
                                            全45問
                                        </span>
                                        <span class="flex items-center text-indigo-600 font-bold group-hover:translate-x-1 transition-transform">
                                            開始する <span class="ml-1">${icons.arrowRight}</span>
                                        </span>
                                    </div>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            // --- 以下のロジックは currentView === 'quiz' の場合 ---

            // 結果画面
            if (showResult) {
                const percentage = Math.round((score / activeQuizData.length) * 100);
                let message = "";
                if (percentage === 100) message = "パーフェクト！完璧な理解です。";
                else if (percentage >= 80) message = "素晴らしい成績です！実務でもバッチリですね。";
                else if (percentage >= 60) message = "合格点です。間違えた箇所を復習しておきましょう。";
                else message = "もう一度資料を読み直して、再チャレンジしましょう！";

                app.innerHTML = `
                    <div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                        <div class="bg-white max-w-2xl w-full rounded-2xl shadow-xl overflow-hidden p-8 text-center animate-fade-in">
                            <div class="w-24 h-24 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                ${icons.trophy}
                            </div>
                            <h2 class="text-3xl font-bold text-gray-800 mb-2">テスト結果</h2>
                            <p class="text-gray-500 mb-8">${activeQuizTitle} (全${activeQuizData.length}問)</p>
                            
                            <div class="text-6xl font-bold text-blue-600 mb-4">
                                ${score} <span class="text-2xl text-gray-400">/ ${activeQuizData.length}</span>
                            </div>
                            <p class="text-xl text-gray-700 font-medium mb-8">${message}</p>
                            
                            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                                <button onclick="backToMenu()" class="inline-flex items-center justify-center gap-2 bg-white border-2 border-gray-200 hover:bg-gray-50 text-gray-700 font-semibold py-3 px-8 rounded-full transition-colors duration-200">
                                    メニューへ戻る
                                </button>
                                <button onclick="restartQuiz()" class="inline-flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-full transition-colors duration-200">
                                    ${icons.rotateCcw} もう一度挑戦する
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            // 中間結果（10問区切り）画面
            if (showIntermediate) {
                app.innerHTML = `
                    <div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                        <div class="bg-white max-w-2xl w-full rounded-2xl shadow-xl overflow-hidden p-8 text-center animate-fade-in relative">
                            <button onclick="backToMenu()" class="absolute top-4 left-4 flex items-center text-gray-500 hover:text-gray-800 transition text-sm font-medium">
                                ${icons.arrowLeft} メニュー
                            </button>
                            
                            <div class="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-6 mt-4">
                                <svg class="w-10 h-10 text-indigo-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                            </div>
                            <h2 class="text-3xl font-bold text-gray-800 mb-2">区切りポイント</h2>
                            <p class="text-gray-500 mb-8">お疲れ様です！ ${currentQuestion + 1}問目まで終了しました。</p>
                            
                            <div class="text-4xl font-bold text-indigo-600 mb-2">
                                直近10問の正解数: <span class="text-5xl">${score - scoreAtBlockStart}</span> <span class="text-xl text-gray-400">/ 10</span>
                            </div>
                            <p class="text-gray-500 mb-8">ここまでのトータル正解数: ${score} / ${currentQuestion + 1}</p>
                            
                            <p class="text-lg text-gray-700 font-medium mb-10">このまま次の問題へ進みますか？</p>
                            
                            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                                <button onclick="redoCurrentBlock()" class="inline-flex items-center justify-center gap-2 bg-white border-2 border-gray-200 hover:bg-gray-50 text-gray-700 font-semibold py-3 px-8 rounded-full transition-colors duration-200">
                                    ${icons.rotateCcw} 前の10問をやり直す
                                </button>
                                <button onclick="continueQuiz()" class="inline-flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-full transition-colors duration-200 shadow-md">
                                    続ける (次の問題へ) ${icons.arrowRight}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            // 通常のテスト画面
            const currentQ = activeQuizData[currentQuestion];
            const progress = ((currentQuestion + 1) / activeQuizData.length) * 100;
            
            // 出典の表示（コンプライアンスの場合は「出典: 」をつけるなどの配慮）
            const sourceText = activeQuizTitle === "コンプライアンス確認テスト" && !currentQ.source.startsWith("出典") 
                                ? `出典: ${currentQ.source}` 
                                : currentQ.source;

            // 選択肢HTMLの構築
            let optionsHtml = '';
            currentQ.options.forEach((option, index) => {
                let iconHtml = '';
                if (isAnswered) {
                    if (index === currentQ.correctAnswer) {
                        iconHtml = icons.checkCircle;
                    } else if (index === selectedOption && index !== currentQ.correctAnswer) {
                        iconHtml = icons.xCircle;
                    }
                }

                optionsHtml += `
                    <button
                        onclick="handleOptionClick(${index})"
                        ${isAnswered ? 'disabled' : ''}
                        class="w-full text-left p-4 rounded-xl border-2 transition-all duration-200 flex items-center justify-between group ${getOptionStyle(index)}"
                    >
                        <span class="font-medium">${option}</span>
                        ${iconHtml}
                    </button>
                `;
            });

            // 解説HTMLの構築
            let explanationHtml = '';
            if (isAnswered) {
                const isCorrect = selectedOption === currentQ.correctAnswer;
                explanationHtml = `
                    <div class="animate-fade-in mt-6">
                        <div class="rounded-2xl p-6 mb-6 ${isCorrect ? 'bg-green-50 border border-green-100' : 'bg-red-50 border border-red-100'}">
                            <div class="flex items-start gap-3">
                                ${isCorrect ? icons.checkCircleLg : icons.alertCircle}
                                <div>
                                    <h3 class="font-bold text-lg mb-2 ${isCorrect ? 'text-green-800' : 'text-red-800'}">
                                        ${isCorrect ? '正解！' : '不正解...'}
                                    </h3>
                                    <p class="text-gray-700 leading-relaxed">
                                        <span class="font-semibold block mb-1">【解説】</span>
                                        ${currentQ.explanation}
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div class="flex justify-end">
                            <button
                                onclick="handleNextQuestion()"
                                class="flex items-center gap-2 bg-gray-900 hover:bg-gray-800 text-white font-medium py-3 px-6 rounded-xl transition-colors duration-200 shadow-md"
                            >
                                ${currentQuestion < activeQuizData.length - 1 ? '次の問題へ' : '結果を見る'}
                                ${icons.arrowRight}
                            </button>
                        </div>
                    </div>
                `;
            }

            // 全体の組み立て
            app.innerHTML = `
                <div class="min-h-screen bg-slate-50 py-8 px-4 sm:px-6 lg:px-8">
                    <div class="max-w-3xl mx-auto animate-fade-in">
                        
                        <!-- トップナビゲーション -->
                        <div class="mb-6 flex justify-between items-center">
                            <button onclick="backToMenu()" class="flex items-center text-gray-500 hover:text-gray-800 transition font-medium text-sm bg-white border border-gray-200 py-1.5 px-3 rounded-lg shadow-sm hover:shadow">
                                ${icons.arrowLeft} メニューに戻る
                            </button>
                        </div>

                        <!-- ヘッダー＆プログレスバー -->
                        <div class="mb-8">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                                <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                                    ${icons.bookOpen}
                                    ${activeQuizTitle}
                                </h1>
                                <span class="text-sm font-medium text-gray-500 bg-white border border-gray-200 shadow-sm py-1.5 px-4 rounded-full inline-block text-center whitespace-nowrap">
                                    問題 ${currentQuestion + 1} / ${activeQuizData.length}
                                </span>
                            </div>
                            <div class="h-2.5 w-full bg-gray-200 rounded-full overflow-hidden shadow-inner">
                                <div 
                                    class="h-full ${activeQuizTitle.includes('コンプライアンス') ? 'bg-indigo-500' : 'bg-blue-600'} transition-all duration-300 ease-out"
                                    style="width: ${progress}%"
                                ></div>
                            </div>
                        </div>

                        <!-- 問題カード -->
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-6">
                            <div class="p-6 sm:p-8 ${activeQuizTitle.includes('コンプライアンス') ? 'bg-indigo-50/50' : 'bg-blue-50/50'} border-b border-gray-100">
                                <div class="flex items-center gap-2 mb-3">
                                    <span class="${activeQuizTitle.includes('コンプライアンス') ? 'bg-indigo-100 text-indigo-800' : 'bg-blue-100 text-blue-800'} text-xs font-bold px-2.5 py-0.5 rounded">
                                        ${sourceText}
                                    </span>
                                </div>
                                <h2 class="text-lg sm:text-xl font-medium text-gray-800 leading-relaxed">
                                    ${currentQ.question}
                                </h2>
                            </div>
                            
                            <div class="p-6 sm:p-8 space-y-3">
                                ${optionsHtml}
                            </div>
                        </div>

                        <!-- 解説＆次へボタン -->
                        ${explanationHtml}

                    </div>
                </div>
            `;
        }

        // 初期描画（メニュー画面）の実行
        render();

    </script>
</body>
</html>
