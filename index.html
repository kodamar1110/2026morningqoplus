    // --- Sample Data (Extracted from PDF) ---
    const QUIZ_DATA = {
      basic: {
        title: "製品知識：Basic編 (60問)",
        desc: "栄養管理、リアルワールドデータ、各種疾患・治療などに関する総合的な確認テストです。",
        countLabel: "全60問",
        questions: [
          { id: 1, question: "浸透圧の説明について、誤っているものを選びなさい。", choices: ["水は浸透圧の低い方から高い方へ移動する", "浸透圧を表す単位はmOsm/Lである。", "ブドウ糖はイオン化する物質である。", "体液の浸透圧の基準値は約285mOsm/Lである。", "イオン化しない物質の場合には、浸透圧とモル濃度は等しい(1mmol/L=1mOsm/L)"], correctIndex: 2, explanation: "イオン化しない物質としてブドウ糖、尿素、尿酸などがある。イオン化しない物質の浸透圧はモル濃度に等しく(1mmol/L=1mOsm/L)、イオン化する場合はモル濃度より大きくなる。" },
          { id: 2, question: "水電解質輸液とその説明で、誤っているものを選びなさい。", choices: ["ビカネイト輸液:等張電解質輸液であり、細胞外液全体を補充する", "ボルベン輸液6%:血漿増量剤あるいは代用血漿剤ともいわれ、血管内の循環血液量を増加させる目的で投与される", "KN1号輸液:1/2生食でありカリウムを含んでいない比較的安全な輸液として、緊急来院時の血管確保などを目的に使用される", "KN3号輸液:健康人の水分電解質の平均1日維持量を目安とした組成であり、カリウムイオンは100mEq/L含む", "5%ブドウ糖液:等張液であるが、ブドウ糖は細胞内で代謝されるため同量の水を投与したことになる"], correctIndex: 3, explanation: "3号液の組成としてKイオン濃度は20mEq/Lである。" },
          { id: 3, question: "飢餓時の異化の状態についての説明で、誤っているものを選びなさい。", choices: ["肝臓のグリコーゲンが優先的に分解され、グルコースとなって血中に放出されるが、ほぼ1日で枯渇する", "脂肪の分解により生じた遊離脂肪酸は酸化によりエネルギーを産生する", "絶食期間が長いと脂肪酸が余剰となりケトン体を生成、蓄積することでケトアシドーシスになるおそれがある", "初期から体蛋白の分解が最も活発に行われ、筋肉が速やかに減少する"], correctIndex: 3, explanation: "初期のエネルギー源はグリコーゲンや脂肪が中心となるため、体蛋白の急速な分解が第一に起こるわけではない。" },
          { id: 4, question: "アミノ酸についての説明で、誤っているものを選びなさい。", choices: ["蛋白質の分解が進むと創傷治癒の遅延や免疫能が低下し生体の適応障害を起こす", "除脂肪体重(LBM)が80%以下になると窒素死と呼ばれる生命の危機が生じるといわれる", "アミノ酸がエネルギーとして消費されると4kcal/gの熱量を産生する", "最近では、必須アミノ酸は不可欠アミノ酸、非必須アミノ酸は可欠アミノ酸とも言われる", "アミノ酸とジペプチド・トリペプチドはそれぞれ別経路の輸送系で吸収される"], correctIndex: 1, explanation: "除脂肪体重(LBM)が「70%以下」になると窒素死と呼ばれる生命の危機が生じるといわれる。" },
          { id: 5, question: "脂質についての説明で、誤っているものを選びなさい。", choices: ["脂質投与の目的は、効率の良いエネルギー供給(9kcal/g)と、必須脂肪酸の供給である", "長鎖脂肪酸トリグリセリド(LCT)の中でリノール酸、リノレン酸は必須脂肪酸である", "必須脂肪酸の補給としては、脂肪として5g/日程度を投与する", "MCTはカイロミクロンにはならず速やかに肝臓に運ばれるためLCTに比べて吸収・代謝が速い", "中鎖脂肪酸はミトコンドリアへの取り込みにカルニチンを必要とせず、直接取り込まれる"], correctIndex: 2, explanation: "必須脂肪酸の補給としては、脂肪として10g/日程度を投与する。" },
          { id: 6, question: "栄養の評価とプランニングに関する説明で、誤っているものを選びなさい。", choices: ["身体計測による栄養評価指標として、体重変化率やBMIなどがある", "血清アルブミン値(Alb)は栄養不良の他、炎症性疾患、採血時の体位でも変動する", "Rapid Turnover Protein(RTP)にはトランスサイレチン(プレアルブミン)、コリンエステラーゼ、3-メチルヒスチジンがある", "基礎エネルギー消費量の推計としてHarris-Benedictの式がある", "1日の必要水分量は(体重kg) × (30~40mL)と簡易に計算する方法もある"], correctIndex: 2, explanation: "Rapid Turnover Protein (RTP)にはトランスサイレチン(プレアルブミン)、レチノール結合蛋白、トランスフェリンがある。" },
          { id: 7, question: "末梢静脈栄養における「血管痛・静脈炎の予防と対策」として、誤っているものを選びなさい。", choices: ["高浸透圧の場合、糖濃度を下げる", "できるだけ大きい径のカニューラを使用する。", "できるだけ血流の多い上肢の太い静脈に留置する。", "なるべく中性に近いpHの輸液を選択する。", "なるべく緩徐に投与する。"], correctIndex: 1, explanation: "必要最小径のカニューラを使用する。" },
          { id: 8, question: "飢餓時のブドウ糖投与による体蛋白の節約効果を見たGambleデータについて、a~cに当てはまる語句を選びなさい。「飢餓状態では、体蛋白の異化により、6日間で約(a)の蛋白質が喪失した。これは筋肉量に換算すると約(b)に相当する。この時ブドウ糖を投与すると蛋白の異化が抑制され、100g/日の投与で蛋白質量 6日間で約(c)となった」", choices: ["a 400g b. 2kg c. 200g", "a. 400g b. 1kg c. 200g", "a. 200g b. 2kg c. 100g", "a. 200g b. 1kg c. 100g", "a 200g b. 1kg c. 50g"], correctIndex: 0, explanation: "飢餓状態では、体蛋白の異化により、1日約70g、6日間で約400gの蛋白質が喪失した。筋肉量に換算すると2kgに相当する。ブドウ糖投与で蛋白の異化が抑制され、100g/日の投与で約200gとなった。" },
          { id: 9, question: "中心静脈栄養(TPN)に関する説明で、誤っているものを選びなさい。", choices: ["TPNは静脈栄養管理のうち、長期間あるいは水分制限を必要な場合に選択される", "NPC/N比は疾患や病態により異なるが通常150~200程度が蛋白合成の効率が高いとされる", "腎不全ではアミノ酸投与量の制限、体蛋白異化亢進による必要エネルギーの増加から、NPC/N比は30~50程度と低くなる", "TPN施行時のビタミンB1の非投与により、ビルビン酸からアセチルCoAの代謝が阻害され、重篤な乳酸アシドーシスを呈することが知られている", "静脈栄養のビタミン投与量指針として、1975年のAMA処方にくらべ、FDA2000処方ではビタミンB1などが増量、ビタミンK投与量が新たに規定された"], correctIndex: 2, explanation: "腎不全ではアミノ酸投与量の制限、体蛋白異化亢進による必要エネルギーの増加から、NPC/N比は300~500程度と高くなる。" },
          { id: 10, question: "経腸栄養法に関する説明で、誤っているものを選びなさい。", choices: ["経腸栄養法の利点として、腸管粘膜の萎縮予防が挙げられるが、CRBSIには注意が必要である", "経腸栄養の禁忌としては、腸管の吸収機能が極端に低下している場合や廃絶している場合がある", "経腸栄養法の合併症としては、下痢などの消化器系合併症が最も発生頻度が高い", "ONSとはOral Nutritional Supplementsの略で、経口的栄養補助を意味する", "経管栄養法は、チューブを用いて栄養を投与する方法で、経鼻法と経瘻孔法に分類される"], correctIndex: 0, explanation: "経腸栄養法の利点として、腸管粘膜の萎縮予防が挙げられる。CRBSIは静脈栄養に特異的な感染症であるため、経腸栄養ではおこらない。" },
          { id: 11, question: "経腸栄養法のうち、経鼻法に関する説明で、誤っているものを選びなさい。", choices: ["経鼻アクセスの特徴として不要時にはいつでも抜去可能であるが、事故抜去(計画外抜去)のリスクも高いことがあげられる", "経鼻チューブの留置では、ほとんど違和感・不快感を感じることがなく、嚥下訓練もしやすい。", "経鼻チューブの留置期間が長くなると鼻や咽頭に炎症を起こしたり、粘膜面のびらん、潰瘍形成の頻度が高くなる", "チューブ挿入時に無理な操作を行うことで消化管穿孔を起こすリスクがある", "気管・気管支内誤挿入は通常咳嗽反射が起こるが、胃内に挿入されたと思われるときもチューブ先端位置を確認することが大切である"], correctIndex: 1, explanation: "経鼻チューブの留置では、ある程度の違和感・不快感が避けられない。嚥下訓練も行いにくい特徴がある。" },
          { id: 12, question: "経腸栄養法のうち、経瘻孔法に関する説明で、誤っているものを選びなさい。", choices: ["消化管瘻アクセスの特徴として、胃瘻では半固形化栄養製品が投与できることや、嚥下訓練がしやすいことがあげられる", "PEG(経皮内視鏡的胃瘻造設術)は、開腹手術をせずに胃瘻を造設する方法である", "PTEG(経皮経食道胃管挿入術)は、内視鏡を用いず超音波下に造設する頸部食道瘻造設術である", "PEG造設に伴う晩期の合併症としてバンパー埋没症候群がある", "留置中のチューブ閉塞対策としてはアルコール注入法によるチューブ内腔の衛生管理が有効である"], correctIndex: 4, explanation: "チューブ閉塞の対策としては十分なフラッシングと酢水ロックによるチューブ内腔の衛生管理が有効である。" },
          { id: 13, question: "経腸栄養法に用いる栄養製品に関する説明で、誤っているものを選びなさい。", choices: ["主な窒素源について、成分栄養剤はアミノ酸、消化態栄養剤はアミノ酸やジペプチド・トリペプチド、半消化態栄養剤は蛋白質である", "成分栄養剤は極めて高脂肪・低糖質であり、高脂血症には注意が必要である", "医薬品経腸栄養剤は薬価請求できる一方で、濃厚流動食品は給食費請求となる", "外来や在宅においては濃厚流動食品は全額患者自己負担となる", "OPFの医薬品消化態経腸栄養剤としてはツインラインNFがある"], correctIndex: 1, explanation: "成分栄養剤は極めて低脂肪であり、必須脂肪酸の補給が別途必要となる。" },
          { id: 14, question: "経腸栄養の「半固形化栄養法」について、誤っているものを選びなさい。", choices: ["胃の機能が正常である場合、半固形栄養を注入したとき、胃の貯留能と排出能を得ることが可能である。", "胃食道逆流や誤嚥性肺炎、下痢、ダンピングなど経腸栄養管理を行う上で問題となる合併症の予防策になり得る。", "胃の機能が不十分な場合など患者状態によって期待する効果が得られず、液体栄養が望ましいケースもある。", "栄養剤リークの対処としては、半固形化よりも液体の方が胃内容物が流出しにくい", "ミキサー食は、粘度調節が必要であるがコストは安い"], correctIndex: 3, explanation: "栄養剤リークの対処として栄養剤の固形化や粘度増強により瘻孔から胃内容物が流出しにくくする方法が有効とされる。" },
          { id: 15, question: "酸塩基平衡に関する説明で、誤っているものを選びなさい。", choices: ["血液(動脈血)のpHは通常約7.4±0.05である", "代謝性アシドーシスの成因のひとつに、下痢などによる腸管からの重炭酸イオンの喪失があげられる", "メイロン投与時の注意点の1つに、換気不十分では細胞内アシドーシスを生じることがあるため、換気を十分に行いCO2排出を図る。", "アシデーミアでは、pHの低下によりKイオンが血液中から細胞内に移動するため血漿Kイオン濃度が低下する。", "アシデーミアでは、イオン化Ca濃度が増加する"], correctIndex: 3, explanation: "アシデーミアでは、pHの低下によりKイオンが細胞内から血液中に移動するため血漿Kイオン濃度が上昇する。" },
          { id: 16, question: "リニュートの特徴について、誤っているものを選びなさい。", choices: ["消化態タイプの濃厚流動食品", "カロリー濃度 1kcal/mL", "エネルギー産生栄養素バランスは炭水化物50%、脂質34%、タンパク質16%", "食物繊維を配合", "乳タンパク質は不使用である"], correctIndex: 2, explanation: "リニュートのエネルギー産生栄養素バランスは、タンパク質24%、炭水化物26%、脂質50%である。" },
          { id: 17, question: "リニュートでイーゲル・イーゲルLCと比べて増量しているもの(100kcalあたり)として、誤っているものを選びなさい。", choices: ["銅", "亜鉛", "コラーゲンペプチド", "ビタミンB1", "リン"], correctIndex: 4, explanation: "リン含有量は3製品すべて同量(82.5mg/100kcal)。ビタミンB1・銅・亜鉛・コラーゲンペプチドは増量している。" },
          { id: 18, question: "ペプタメンAFと比べた時のリニュートの特徴として、正しいものを選びなさい。", choices: ["より高タンパクである (100kcalあたり)", "カルニチンを配合している", "イヌリンを配合している", "脂質としてMCTの割合がより高い", "ホエイペプチドを配合している"], correctIndex: 1, explanation: "ペプタメンAFはカルニチン無配合。リニュートにはカルニチン40mg/100kcal配合している。" },
          { id: 19, question: "水溶性食物繊維ではないものを選びなさい。", choices: ["セルロース", "グアーガム", "フルクトオリゴ糖", "イヌリン", "アルギン酸"], correctIndex: 0, explanation: "セルロースは不溶性食物繊維である。" },
          { id: 20, question: "イーゲルLCの特徴として、誤っているものを選びなさい。", choices: ["糖質量を減らし (Low-Carbohydrate)、脂質代謝に必要なL-カルニチン (L-carnitine)を配合したことで、LCと名付けている", "0.8kcal/mL、浸透圧340mOsm/Lである", "200kcal, 300kcal、400kcalと3規格を揃えている", "DHAとEPAを配合している", "タンパク質は4.0g/100kcal配合している"], correctIndex: 3, explanation: "ハイネックスシリーズで、DHAとEPAを配合しているのはリニュートのみである。" },
          { id: 21, question: "他社製品の特徴について正しいものを選びなさい", choices: ["REF-P1はペクチンを含む粘度調整食品で、使用方法は、栄養剤と同時に投与する", "マーメッドワンは消化態の粘度可変型流動食である", "ペプタメンシリーズはすべて1.5kcal/mLの高濃度の流動食である", "乳酸菌配合の流動食として、ペプチーノ、ラクフィアがある", "グルセルナREXは糖質制限栄養製品で、脂質のエネルギー比率を50%にしている"], correctIndex: 4, explanation: "①栄養剤投与前に注入をする ②半消化態 ③ペプタメンインテンスは1kcal/mL ④ペプチーノは乳酸菌を含まない。したがって⑤が正しい。" },
          { id: 22, question: "ハイネックスゼリーの特徴について、誤っているものを選びなさい。", choices: ["900~1500kcalを標準的な1日摂取量として、製剤設計がされている", "粘度は約6,000mPa・s (B型粘度計・12回転/分・20℃)である", "寒天で固めているため、付着性が低く、ベタつきにくい物性である", "脂肪酸 n-3:n-6の比率は1:3である。", "アレルギー物質(28品目中)として、乳成分・大豆・ゼラチンを含む"], correctIndex: 1, explanation: "粘度は約8,700mPa's。6000は旧ハイネゼリーの粘度である。" },
          { id: 23, question: "ハイネックスゼリーとイノソリッドの共通の特徴として、誤っているものを選びなさい。", choices: ["1袋 300kcal/300gである", "カルニチン、コリンを配合している", "食物繊維としてイヌリンを配合している", "消化吸収に優れたMCTを配合している", "900kcalの摂取で、1日に必要なビタミン・微量元素をほぼ充足できる"], correctIndex: 1, explanation: "カルニチンは2製品とも配合しているが、コリンはイノソリッドのみ配合している。" },
          { id: 24, question: "ハイネックスゼリー(水分量76%)で、エネルギー量1200kcal・水分量1500mLで管理したい場合、追加水はどのくらい必要か?", choices: ["388mL", "588mL", "740mL", "840mL", "976mL"], correctIndex: 1, explanation: "1200g x 0.76 = 912mL。 1500 - 912 = 588mL。" },
          { id: 25, question: "ラコールNF半固形剤1バッグから、イノソリッド1バッグに投与を切り替えた際に、投与量が同等となる成分を選びなさい。", choices: ["食塩相当量", "糖質量", "たんぱく質量", "脂肪量", "水分量"], correctIndex: 4, explanation: "ラコール半固形剤とイノソリッドの水分含有率は76%で同じ水分量である。" },
          { id: 26, question: "イノソリッドの説明として、誤っているものを選びなさい", choices: ["イノラスと単位あたり (g・mLあたり)の熱量は同じである。", "日本人の食事摂取基準(2020年版)に基づいた処方設計であり、エネルギー産生栄養素バランスは2025年版の目標値にも合致する。", "処方設計熱量は900kcal/日、成人標準量は900~1500kcal/日である。", "1500kcalを投与したとき、日本人の食事摂取基準(2025年版)の耐容上限量(18歳以上)を超える成分はない。", "n-3系脂肪酸の主な供給源として、シソ油と魚油を配合している。"], correctIndex: 0, explanation: "イノソリッドは1.0kcal/g、イノラス液剤は1.6kcal/mLである。" },
          { id: 27, question: "在宅半固形栄養経管栄養法指導管理料について、誤っているものを選びなさい。", choices: ["算定できる点数は、2500点/月である。", "本管理料を算定している入院中以外の患者に対して、栄養管セットを使用した場合、在宅経管栄養法用栄養管セット加算2000点/月を算定できる。", "あらかじめ調整された半固形状のものを用いた場合のみ算定でき、胃内で形状が変わるタイプのものは対象とならない。", "最初に算定した日から起算して3年を限度として算定できる。", "要件を満たしていれば、半固形状の濃厚流動食(医薬品ではない)を使用して算定できる。"], correctIndex: 3, explanation: "最初に算定した日から起算して「1年」が限度である。" },
          { id: 28, question: "キドバレン輸液の禁忌として、誤っているものを選びなさい。", choices: ["高乳酸血症の患者", "高ナトリウム血症の患者", "高リン血症の患者", "高アンモニア血症の患者", "肝性昏睡又は肝性昏睡のおそれのある患者"], correctIndex: 2, explanation: "キドバレン輸液にはリンが配合されていないため禁忌ではない。" },
          { id: 29, question: "( )に当てはまる語句を選びなさい。慢性腎不全患者に対するTPN処方のインターネット調査結果によると、CKD食事療法基準を目安としているが、実際には目標とするTPN管理が実施できていない理由として最も多かったのが( )であった。", choices: ["重度の糖尿病患者が多く、糖分からのカロリー量を少なく設定している。", "心血管系の合併症等で投与液量が制限されることが多く、CKD食事療法基準よりも少ないカロリー、アミノ酸量を設定している。", "個別の電解質量を考慮した結果、全体的なカロリー投与量を少なく設定している。", "既承認医薬品の組合せではCKD食事療法基準を目安に処方設計することが困難である。(混合調製作業を含む)", "その他の理由"], correctIndex: 1, explanation: "調査結果では、②「心血管系の合併症等で投与液量が制限されることが多く…」が最も多い理由として挙げられました。※一部資料の解説(59.2%)と選択肢の順序が異なる場合がありますが、内容としてはこちらが最多回答となります。" },
          { id: 30, question: "体重50kgの患者にキドパレン輸液1バッグを投与した場合、エネルギーは30kcal/kg/日、蛋白質量(アミノ酸量)は約( )g/kg/日となる。", choices: ["0.46", "0.56", "0.66", "0.76", "0.86"], correctIndex: 2, explanation: "CKD食事療法基準の保存期CKD患者で推奨される、0.6~1.0g/kg標準体重/日を充足できる処方設計となる(0.66g)。" },
          { id: 31, question: "キドバレン輸液の組成について、正しいものを選びなさい。", choices: ["バッグに含まれる Na+は35mEqである。", "1バッグに含まれるK+120mEqである。", "FDA2000処方に準拠したビタミン、微量元素を配合している。", "必須アミノ酸/非必須アミノ酸比は3.4で、ArgやGlyを配合している", "分岐鎖アミノ酸含有率は45.8w/w%で、キドミン輸液と同じである。"], correctIndex: 4, explanation: "①150mEq ②カリウムは配合していない ③微量元素は配合していない ④Glyは配合していない。" },
          { id: 32, question: "エネフリード輸液1バッグ (550mL)とビーフリード輸液1バッグ (500mL)の成分について、誤っているものを選びなさい。", choices: ["ブドウ糖量が同じである。", "分岐鎖アミノ酸含有率が同じである。", "ビタミンB1量が同じである。", "ナトリウム量が同じである", "亜鉛量が同じである"], correctIndex: 2, explanation: "ビーフリードのビタミンB1量はAMA処方、エネフリードのビタミンはFDA2000処方に準拠しているため異なる。" },
          { id: 33, question: "エネフリード輸液投与時のライン管理について誤っているものを選びなさい。", choices: ["可能な限り、側注口のない輸液ラインを選択する。", "可能な限り、除菌用ファイナルフィルターを使用する。", "可能な限り、閉鎖式輸液ラインを使用する。", "輸液ライン側管から他の薬剤を投与しない", "エネフリード投与後に、注射剤の混合調製がない輸液製剤を投与する際、輸液ラインはエネフリード投与開始後24時間毎に交換する。"], correctIndex: 1, explanation: "除菌用ファイナルフィルターは使用できない。(脂肪粒子が目詰まりする)" },
          { id: 34, question: "ビーフリード輸液について、誤っているものを選びなさい。", choices: ["2000mLの投与で60gのアミノ酸を補給できる。", "重篤な腎障害のある患者(透析又は血液ろ過を実施している患者)は禁忌とはならない。", "隔壁を開通せずに下室のみ投与した際、高血糖を起こすリスクがある。", "うっ血性心不全のある患者に対して禁忌となっているのは、十分な栄養量を補給する場合に、過剰な水分負荷がかかるためである。", "隔壁未開通の状態で上室が着色していた場合、メイラード反応によるものと推測できる。"], correctIndex: 4, explanation: "上室のみで着色がある場合に考えられるのは、アミノ酸の酸化。メイラード反応は隔壁開通後ブドウ糖とアミノ酸が混合されて発生する。" },
          { id: 35, question: "アクトリーンについて、誤っているものを選びなさい", choices: ["ハイライト カテ(ネラトン)には、径の大きさが違う5種類があり、ハイライトカテ(チーマン)には、径の大きさが違う4種類がある。", "カテーテルは植物由来のグリセリンと蒸留水を使用したゲル状の潤滑剤でコーティングされている。", "重大な有害事象として、尿路感染、膀胱・尿道損傷、出血、尿道炎症がある。", "1箱(30本入り)に1つ、携帯ポーチが付いている。", "特殊カテーテル加算の「2.間歌導尿用ディスポーザブルカテーテルの親水性コーティングを有するもの」に該当し、400点が算定できる。"], correctIndex: 4, explanation: "400点(5400点)算定できるのは再利用型カテーテル。アクトリーンはディスポーザブルである。" },
          { id: 36, question: "アクトリーンについて、誤っているものを選びなさい", choices: ["アクトリーン セットは逆流防止機構を備えた採尿バッグと一体化している。", "ミニのカテーテル長は全て90mmである。", "ハイライト セットの採尿バッグ容量は700mLである", "男性用はコンパクトに折りたたんで持ち運ぶことができ、折り曲げは24時間まで可能である。", "チーマンタイプを選択する場合として、尿道狭窄などにより挿入困難な患者などがある。"], correctIndex: 2, explanation: "ハイライト セットの採尿バッグ容量は1000mLである。" },
          { id: 37, question: "タムガイドについて、生体透過光(BT光)の説明と体表で見えるイメージの記載として、誤っているものを選びなさい。", choices: ["柔らかい組織は透過するが、骨や軟骨など硬い組織は透過しない波長域の光である。", "下咽頭通過時は体表に近いため光が見えることがある。", "胃に入った直後に腹部で光が見えることが多い。", "胃に入った直後は、通常、胃底部に向かう。", "胃底部の壁に当たった場合、肋間で光が見えることがある"], correctIndex: 2, explanation: "胃に入った直後は、通常、体表で光は確認できない。" },
          { id: 38, question: "タムガイドで行った102例の臨床データおよび考察について、誤っているものを選びなさい。", choices: ["BT光を確認した87症例全てで、X線画像突合により胃内留置が確認された", "気管内に留置された1症例において、胸部で光が確認された。", "X線検査で胃内に位置していると診断されたとき、必ずしもBT光が確認できたわけではなかった。", "BT光が検出できなかった場合、X線検査を実施することは必要である。", "肥満患者(BMI>27.5. N=9)の感度は患者群全体と比べ低く算出されたが患者数が少ないため統計的有意性は検定できなかった。"], correctIndex: 1, explanation: "気管内(1例)、食道又は食道胃接合部(3例)に留置された症例については光は確認されなかった。" },
          { id: 39, question: "タムガイドの使用方法、注意事項等について誤っているものを選びなさい。", choices: ["タムガイドの電源ボタンを押すたびに、点滅→点灯→消灯と変わる", "光源装置消灯後、または、ファイバーを外し30分以上経過すると、使用済みファイバーと認識される。", "ファイバーは感染予防の観点から「再減菌禁止・再使用禁止」としている。", "光源装置は市販の表面消毒剤または水で薄めた中性洗剤を含ませた布等で表面を清掃する。", "ファイバーを経鼻胃管から抜去する際、抵抗があり抜去出来ない場合には経鼻胃管とともに抜去する。"], correctIndex: 1, explanation: "30分ではなく15分以上経過すると使用済みと認識される。" },
          { id: 40, question: "タムガイドに関する診療報酬点数 J034-2 経鼻栄養 180点について、誤っているものを選びなさい。", choices: ["DPC(包括) 病棟では算定不可", "外来で算定可", "一般病棟(非DPC病院)で算定可", "回リハ、地域包括ケア病棟で算定可", "在宅で算定可"], correctIndex: 3, explanation: "回リハ、地域包括ケア病棟では算定不可である。" },
          { id: 41, question: "脳卒中と栄養療法に関する記述で誤っているものを選びなさい。", choices: ["脳卒中発症時のサルコペニアの有病率は15.8%であるという研究報告がある。", "脳卒中急性期では多くの症例で、早期の栄養療法の導入が遅れがちと言われている", "脳卒中では糖尿病の既往がない症例でも耐糖能異常を併発している", "脳卒中治療ガイドライン2021では48時間以内の早期経腸栄養が推奨されている"], correctIndex: 3, explanation: "脳卒中発症後7日以上にわたって十分な経口摂取が困難な患者では経腸栄養等を行うことは妥当であるという推奨であり、時間に関する詳細な記載はない。" },
          { id: 42, question: "脳卒中に関する記述で誤っているものを選びなさい", choices: ["低ナトリウム血症は脳卒中における最も一般的な電解質異常であり脳卒中の死亡率と機能的転帰に悪影響を及ぼすとされている", "中国人を対象とした研究で、重症脳卒中初期の高カロリー経腸栄養(推定必要カロリーの90~110%)は死亡率の上昇と関連している可能性があることが示された。", "広島大学からの報告によると、血清中のF. nucleatumに対する抗体の検出は、脳卒中後の予後不良と独立して関連していることが示された。", "脳卒中急性期には頭蓋内圧亢進やめまい症状などで嘔気・嘔吐を生じやすいことも加わり、発症直後の急性期には経口摂取、経腸投与は敬遠されがちと言われている。"], correctIndex: 1, explanation: "重症脳卒中初期の「低カロリー経腸栄養」が死亡率の上昇と関連している可能性があることが示された。" },
          { id: 43, question: "脳卒中における経腸栄養管理と口腔ケアに関する記述で誤っているものを選びなさい", choices: ["脳卒中ではリハビリを積極的に行うため、リハ時間確保のために経腸栄養の投与時間を短時間に留めたいというニーズがある。", "「脳卒中治療ガイドライン2021」によると、急性期脳卒中患者の口腔ケアは、誤嚥性肺炎のリスクを低下させる点から勧められる", "「柏スタディ」において、正常群とオーラルフレイル群とを比較したところ、オーラルフレイル群で身体的フレイル、サルコペニア、要介護認定、総死亡リスクが2倍以上高まるという結果が示された。", "くも膜下出血における脳血管攣縮の予防でクラゾセンタンという薬剤が普及している。この薬剤の影響で、脱水の懸念があるので、水分のインプットは多めにコントロールする事が求められている"], correctIndex: 3, explanation: "体液貯留に留意し水分バランスを+500ml以内に抑える必要がある。" },
          { id: 44, question: "誤嚥性肺炎と口腔ケアに関する記述で誤っているものを選びなさい", choices: ["口腔内のバイオフィルムが気管に侵入することで誤嚥性肺炎となることがあり、経腸栄養中にも口腔ケアをすることの意義があるといえる。", "口腔ケアの効果として、全身感染症である誤嚥性肺炎の予防にも寄与する可能性が示されている。", "寺本らの報告によると、入院肺炎患者における誤嚥性肺炎の比率は高齢者において高くなる傾向があり、70歳~79歳でその比率はピークとなることが示されている。", "米山らの報告において、特別養護老人ホーム入所者に対する口腔ケア介入が2年間の発熱発症率や肺炎発症率を低減することを示した。"], correctIndex: 2, explanation: "年齢が高くなればなるほど肺炎患者における誤嚥性肺炎の比率は高くなり、90歳以上でその比率は最も高くなることが示された。" },
          { id: 45, question: "頭頸部癌の栄養療法に関する記述で誤っているものを選びなさい", choices: ["頭頸部癌治療として行われる放射線療法による摂食関連症状の一つとして口腔内乾燥があげられる。", "鈴木基之らの「頭頸部癌化学放射線療法に対する栄養支持療法とその効果に関する検討」は単群の介入試験として報告されている。", "頭頸部癌治療におけるキードラッグであるシスプラチンやセツキシマブ投与時には低マグネシウム血症に注意する必要がある。", "日本頭頸部癌学会のガイドラインにおいて、頭頸部癌患者の体重を10%以上低下させないために胃造設が推奨される旨が記載されている。"], correctIndex: 3, explanation: "栄養管理の最低限の目標として体重を10%以上低下させないことが記されているが必ずしも胃瘻造設を推奨しているわけではない。" },
          { id: 46, question: "がん悪液質に関する記述で誤っているものを選びなさい。", choices: ["がん悪液質と診断された患者には栄養療法、運動療法、薬物療法、心理サポートなどを組み合わせたマルチモーダル・ケアの実施が提唱されている。", "がん診療連携拠点病院に勤める医療従事者を対象にしたアンケート調査の結果、がん悪液質の国際的な定義の認知率は50%を下回っていた。", "がん悪液質の有病率を調査した研究では、膵癌患者のがん悪液質の有病率が最も高い事が示されている。", "がん患者を対象にしたアンケート調査によると、がん悪液質の悪影響が明らかになってから専門知識を持つ医療スタッフによる栄養サポートを望んでいる事がわかった。"], correctIndex: 3, explanation: "がんと診断された早い段階から専門知識を持つ医療スタッフによる栄養サポートを望んでいる。" },
          { id: 47, question: "重症患者の静脈栄養、リアルワールドデータに関する記述で誤っているものを選びなさい", choices: ["観察研究に位置づけられるリアルワールドデータ研究は近年その価値が見直されており、一様にエビデンスレベルが低いとは言い切れない。", "重症患者に対する早期の栄養療法として許容される少なめの栄養投与を意味する「permissive underfeeding」が一般的になっている。", "Yasudaらの報告から、本邦ICUにおいて入室4-7日目の平均アミノ酸処方量が1.2g/kg/day以上である事と院内死亡率改善との関連が示された。", "Yasudaらの報告から、2016年の日本版重症患者栄養療法ガイドラインをきっかけとして静脈栄養によるエネルギー投与量が減少傾向にあることが推定された。"], correctIndex: 2, explanation: "1.2g/kgが間違い(正しくは0.6g/kg)。リアルワールドデータによれば、1.2g/kgを越えて処方を行っている症例が少なく、高たん白投与群を作る事が出来なかった。" },
          { id: 48, question: "オートファジー、mTORに関する記述で誤っているものを選びなさい", choices: ["オートファジーには恒常的(常に低い活性で起動)と誘導的(一過性に著しく活性)があり、細胞内成分を分解することで不要物を除去すると同時に、分解産物(アミノ酸、グルコース、脂肪酸、核酸等)を栄養素として細胞に提供する。", "mTORC1活性化とリン酸輸送体発現亢進は関連しており、集中治療の急性期には血清リン値のモニタリングが重要である。", "加齢による筋肉量の減少は、慢性炎症によって生成される炎症性サイトカインによってmTORC1の活性が抑制されるのが原因である。", "mTORC1はインスリン、アミノ酸(特にイソロイシン)の刺激によるリン酸化により活性化され筋肉細胞の増殖やタンパク質合成が始まる。"], correctIndex: 3, explanation: "インスリン、アミノ酸(特にイソロイシンではなくロイシン)の刺激によるリン酸化により活性化される。" },
          { id: 49, question: "小児・重心患者の栄養管理に関する記述で誤っているものを選びなさい。", choices: ["新生児、乳児の栄養補給の第一選択は母乳であり、幼児期ごろからミキサー食や経腸栄養剤が利用される。", "カルニチン欠乏の一因に、バルプロ酸ナトリウムやピボキシル基含有抗生物質などの薬剤性や、骨格筋量が少ない貯蔵不足などがある。", "栄養管理上、非アテトーゼ型は痩せやすいため投与量不足に注意し、アテトーゼ型では太りやすいため過剰投与に注意する。", "小児では、たん白合成の面からNPC/Nは200~400を目標にする"], correctIndex: 2, explanation: "アテトーゼ型と非アテトーゼ型の記述が逆である。(アテトーゼ型が痩せやすく、非アテトーゼ型が太りやすい)" },
          { id: 50, question: "半固形栄養に関する記述で誤っているものを選びなさい", choices: ["在宅半固形栄養経管栄養法指導管理料は、2,500点/月である。胃造設術後1年以内に当該療法を開始し、最初に算定した日から起算して1年を限度として算定する。", "胃の機能には、噴門で胃食道逆流を防ぐ働きがある。", "合田文則先生が提唱した胃食道逆流予防に必要な粘度である20,000mPa・sは、B型粘度計12回転/分での値である。", "ダンピング症候群は、体液(細胞外液)が小腸に移行し、循環血液量が低下することを起因とする「早期ダンピング症候群」とインスリンが過剰に分泌され低血糖が起こることを起因とする「後期ダンピング症候群」に分けられる。"], correctIndex: 2, explanation: "合田文則先生が提唱した20,000mPa・sは、B型粘度計6回転/分での値である。" },
          { id: 51, question: "CKD・透析に関する記述で誤っているものを選びなさい", choices: ["CKDの診断がされても、比較的GFRが保たれた早期のステージ(1・2)では、たんぱく質は「過剰な制限をしない」ことが推奨されている。", "CKDの栄養障害をPEW (protein energy wasting)と呼び、CKDの病態を基盤として、栄養不良・尿毒素の蓄積・代謝亢進・炎症などがある。", "「腎臓リハビリテーション」とは、単なる運動療法を目的とするのではなく、CKD患者における運動療法、食事療法と水分管理、薬物療法、教育、精神・心理的サポートなども行う、長期にわたる包括的なプログラムのことをいう。", "透析患者の死亡率との関係をみたところ、筋力よりも筋肉量の方が、強い関連が見られ、筋肉量を保つことが重要と考えられる。"], correctIndex: 3, explanation: "筋力および筋肉量と死亡率との関連をみたところ、低筋肉量では有意差はなく、低筋力のみが死亡リスクの増加と関連した。" },
          { id: 52, question: "CKD患者における輸液栄養管理に関する記述で誤っているものを選びなさい", choices: ["ESPENの示す栄養サポートのアルゴリズムにおいて、低栄養のCKD (透析)患者は食事療法やONSが優先される。", "300名の医師を対象にした、慢性腎不全患者に対するTPN処方調査で、TPN処方を組む際に、総合ビタミン剤は約90%処方されていたが、微量元素製剤も一緒に処方するケースは約65%であった。", "GFRが60mL/分/1.73m2未満の状態や蛋白尿など明らかな腎障害が1か月以上続くと、CKDと診断される。", "慢性腎不全患者に対してTPNで栄養管理をする場合、水分量制限があるため、十分なエネルギーやアミノ酸を投与出来ないケースがある。"], correctIndex: 2, explanation: "明らかな腎障害が「1か月」ではなく「3か月」以上続くとCKDと診断される。" },
          { id: 53, question: "透析患者の栄養に関する記述で誤っているものを選びなさい", choices: ["透析患者のたんぱく質摂取量と死亡リスクとの関連を見ると、たんぱく質摂取量が少ないほど死亡リスクが上昇するが、1.3g/kg/日以上の場合も、死亡リスクが上昇する。", "透析中のONSの有用性が示されているが、他社も含め、医薬品の経腸栄養剤は、全て「高度の腎障害」が禁忌になる為、使用できない。", "NRI-JHは、日本人のデータ(日本透析医学会の統計調査データ)を用いて作られたので、日本では、透析患者の栄養評価としてNRI-JHが使用されている", "地域在住の日本人高齢者では、サルコペニア合併率は男性8.3%、女性7.7%に対し、透析患者におけるサルコペニア合併率は27.4~68.0%と非常に高くなっている。"], correctIndex: 1, explanation: "腎機能に関連する禁忌は製剤ごとに異なる。エンシュア等は禁忌の記載なし、エンシュアHは腎不全末期が禁忌等である。" },
          { id: 54, question: "心不全に関する記述で誤っているものを選びなさい", choices: ["心不全患者は、入院と退院を繰り返し終末期に向かう事が特徴的で、2020年のコホート研究では300日程度で半数ほどの患者が再入院する事が示唆された。", "心不全治療における薬物療法はFantastic Fourと呼ばれる4つの薬剤を適切に使用する事が重視されるが、高齢患者では利益・不利益のバランスが不利益に傾く可能性も議論されるようになっている", "Uemuraらの2024年の報告では、急性期心不全の治療のための入院中に口腔機能問題や栄養不良を有する患者では、在院死が有意に多いことが示された。", "Rozentryt Pらの報告によると、慢性心不全患者(悪液質あり)23例に、ONSとして1日600kcalを6週間投与したところ、体重・脂肪組織・血中コレステロールの増加、血中TNF-α値、QOLの改善がみられた。"], correctIndex: 2, explanation: "在院死の増加ではなく、入院期間中のバーセルインデックス(ADL)の低下が示された。" },
          { id: 55, question: "心臓リハビリテーションに関する記述で誤っているものを選びなさい。", choices: ["運動療法だけではなく、患者と家族への教育、カウンセリング、栄養・食事指導、服薬指導、生活指導、禁煙指導、ストレスコントロール、職業復帰訓練などを含めた患者支援を行うことを包括的心臓リハビリテーションという", "LVEF(左室駆出率)が40%未満に低下した心不全をHFrEFといい、LVEFが50%以上保たれた心不全を HFpEFという。", "北里大学からの報告によると、心不全による入院患者約5万人のうち、入院中リハと外来リハともに行っているのは、33%程度であった。", "慢性心不全の入院患者に対する個別栄養サポート (EFFORT study 二次解析)では、個別の栄養介入により入院30日以内において全体の心不全患者の生存率が有意に改善した。"], correctIndex: 2, explanation: "入院中リハと外来リハともに行っているのは「33%」ではなく「7%」程度であった。" },
          { id: 56, question: "ハイネックスイーゲル(ハイネイーゲル)に関連する記述で誤っているものを選びなさい", choices: ["食道癌術後の経腸栄養管理において、下痢発生群は非発生群と比べて生存期間中央値が短く、予後悪化を招く可能性がある事が示されている。", "健康診断参加者を対象にした研究で、PPIの使用が血清プレアルブミン値の低下と関連していることが示されている。この要因として、PPIによる胃酸分泌の抑制がタンパク質の吸収障害を招いているのではないか?と考察されている。", "2019年に虎ノ門病院から、食道癌術後の腸瘻管理でイーゲルの有用性を示唆する研究論文が投稿されている。", "慢性期病院にてTPNだけの管理をする場合、60日を超えると処置区分が変更され、病院としては減収となる。"], correctIndex: 3, explanation: "「60日」ではなく「30日」を超えると処置区分が変更される。" },
          { id: 57, question: "食物繊維に関する記述で誤っているものを選びなさい", choices: ["グアーガム分解物とペクチンを含有した濃厚流動食品を比較した高橋先生の報告では、両群間で短鎖脂肪酸の産生量も腸内細菌叢の悪玉菌減少率も有意差はなく、食物繊維として同等の効果が期待されると報告されている。", "ハイネックスシリーズに配合されているペクチンは、超低メトキシアミド化ペクチン(VLMA)という一般の食品に広く使われているペクチンと違って特殊なペクチンであり、他のペクチンより大腸で発酵分解率が高く短鎖脂肪酸産生効果が高いと考えられる。", "食物繊維の発酵分解率は食物繊維の種類によって差があり、発酵分解率の高い食物繊維にはグアーガム分解物、ペクチン、イヌリンなどが代表的なものとしてあげられる。", "日本人の食事摂取基準2020年版では食物繊維の摂取目標量は男性21g以上、女性18g以上であるが、この目標量は全年代で不足している。"], correctIndex: 1, explanation: "VLMAは他のペクチンより発酵分解率は低く、ラットを使った試験では50%程度が発酵分解すると考えられる。" },
          { id: 58, question: "褥瘡と栄養療法に関する記述で誤っているものを選びなさい", choices: ["コラーゲンペプチドに含有されているアミノ酸のヒドロキシプロリンが、直接、コラーゲン合成の原材料として利用されることにより、褥瘡患者の創傷治癒が期待される", "褥瘡予防・管理ガイドライン第5版(2022年)では褥瘡の治療に高エネルギー・高タンパク質の栄養補給を提案するとされており、エネルギー量は30kcal/kg/日以上、タンパク量は1.0g/kg/日以上が必要と記載されている。", "褥瘡予防・管理ガイドライン第5版(2022年)では褥瘡患者に対して亜鉛、アスコルビン酸、アルギニン、L-カルノシン、n-3系脂肪酸、コラーゲン加水分解物、β-ヒドロキシβ-メチル酪酸、α-ケトグルタル酸オルニチンなど特定栄養素については疾患を考慮したうえで補給してもよいと記載がある。", "褥瘡予防・管理ガイドライン第5版(2022年)では栄養に関するCQ(クリニカルクエスチョン)が全体で1つのみである。"], correctIndex: 0, explanation: "直接原材料として利用されるのではなく、ヒドロキシプロリンを含むジペプチドが線維芽細胞を刺激することによりコラーゲン合成が活発になる。" },
          { id: 59, question: "パーキンソン病と栄養療法に関する記述で誤っているものを選びなさい", choices: ["パーキンソン病 (PD)では、病期の進行とともに、約8割の患者さんで嚥下障害を合併するといわれている。", "パーキンソン病の自律神経障害には、便秘などの消化器症状のほか、蓄尿障害、起立性低血圧、発汗障害、流涎、体重減少などがある。", "パーキンソン病とは、大脳の下にある中脳の黒質と呼ばれる部位に原因不明の変性が生じ、ドパミンと呼ばれる神経伝達物質の分泌が低下する疾患である。", "エネフリード輸液やエルネオバNF輸液の添付文書には、レボドパの有効性を減じるおそれがある旨の記載があるが、含有しているピリドキシンの量は少量のため、問題はない。"], correctIndex: 3, explanation: "少量であれば問題ないというデータはない。有効血漿濃度を下回る可能性が高くなる。" },
          { id: 60, question: "排尿ケアに関連する記述で誤っているものを選びなさい。", choices: ["Foleyがバルーン付きのカテーテルを開発した", "「病院感染対策ガイドライン2018年版(2020年3月増補版)」によると尿路感染症は医療関連感染全体の36%を占める。", "CICの目的に膀胱の過伸展の予防、腎機能障害の予防、尿路感染症の予防、活動性の向上などがある。", "尿道留置カテーテルを抜去して自然排尿があったとしても膀胱内に尿が残っていれば尿路感染症などの有害事象を引き起こす恐れがあるため残尿測定を行う。"], correctIndex: 1, explanation: "以前は36%でしたが現在は10%です(2018年版【2020年3月増補版】)。" }
        ]
      },
      advance: {
        title: "製品知識：Advance編 (40問)",
        desc: "プロモーションコード、医療機関等への資金提供、寄附などのルールに関する確認テストです。",
        countLabel: "全40問",
        questions: [
          { id: 61, question: "公認資材「キドパレン輸液を使用する時の注意点」の内容について、誤っているものを選びなさい。", choices: ["低カリウム血症に伴ってみられる症状としてeGFRの高値、乏尿が知られている。", "リフィーディング症候群は慢性的な高度の低栄養患者に急速な栄養補給を行うことで発症するリスクがある。", "リフィーディング症候群ハイリスク患者には栄養開始前、開始後10日間はビタミンB群や微量元素を補給する。", "キドバレン輸液と併用注意の薬剤としてジギタリス製剤(ジゴキシン等)、パーキンソン病治療薬(レボドパ)、ワルファリンがあげられる。"], correctIndex: 0, explanation: "eGFRの低値、頻尿が低カリウム血症に伴う症状としてみとめられる。" },
          { id: 62, question: "公認スライド「PPN施行時の衛生管理」の内容について、正しいものを選びなさい。", choices: ["Candida albicans の輸液中繁殖変化をみた報告では、4日間の観察で、アミノ酸加糖電解質液に比べて、生理食塩液での増殖が顕著だった。", "Bacillus cereus の輸液中発育量変化をみた報告では、48時間時点において、TPN輸液、維持液などと比べて、アミノ酸加糖電解質液での発育量が最も著しい増殖を認めた。", "環境検査の結果から、タオルケットや寝間着に比べて、ベッド柵や洗濯機でBacillus cereus のコロニー数が多く検出されており、環境衛生への配慮が必要とされている。"], correctIndex: 1, explanation: "アミノ酸加糖電解質液中での増殖がより顕著であった。Bacillus cereusはタオルケットや寝間着におけるコロニー検出が多かった。" },
          { id: 63, question: "公認スライド「リアルワールドデータ研究からみるアミノ酸処方量と予後の関連」の内容について、誤っているものを選びなさい。", choices: ["蛋白質の構成単位であるアミノ酸は筋肉量の維持や免疫機能に対して重要な役割を担っている。", "内科系静脈栄養患者を対象とした臨床転機に対するアミノ酸の容量依存効果をみた試験の主要評価項目は院内死亡であった。", "内科系静脈栄養患者を対象とした臨床転機に対するアミノ酸の容量依存効果をみた試験で、絶食開始後4~10日目の経静脈的平均アミノ酸処方量の減少と院内死亡の増加との関連が認められた。", "腎不全用アミノ酸注射液のアミノ酸濃度は約9g/100mLである。"], correctIndex: 3, explanation: "腎不全用アミノ酸注射液のアミノ酸濃度は5.9~7.2g/100mLである。" },
          { id: 64, question: "公認資材「腎不全患者の急性疾患治療中に一律のタンパク制限をしていませんか?」の内容について、誤っているものを選びなさい。", choices: ["血液透析1回あたりのアミノ酸漏出量は8~12g程度といった報告(ESPEN)がある。", "慢性腎臓病に対する食事療法基準2014年版において、ステージ5D血液透析(週3回)患者に対して30~35kcal/kgBW/日のエネルギー、0.9~1.2g/kgBW/日のタンパク質投与が推奨されている。", "静脈経腸栄養ガイドライン第3版において、血液透析及びCAPDの患者では、20kcal/kg/日、タンパク質として0.8g/kg/日を投与する(BII)としている。", "2021年の急性・慢性腎不全に関するESPENガイドラインにおいて、急性/重症疾患を伴わないCKDの入院患者に0.6~0.8g/kg/日のタンパク質摂取量を処方してもよい、としている。"], correctIndex: 2, explanation: "静脈経腸栄養ガイドライン第3版において、血液透析患者で1.0~1.2g/kg/日、腹膜透析患者で1.1~1.3g/kg/日を投与する、としている。" },
          { id: 65, question: "公認スライド「妊娠悪阻と輸液・栄養管理」の内容について、誤っているものを選びなさい。", choices: ["「妊娠中の悪心・嘔吐」は妊娠初期の半数以上に認められる", "産婦人科学会診療ガイドライン 2023年版において、「妊娠悪阻では、妊娠による生理変化と嘔吐によって低K血症に陥りやすいことに留意する」といった記載がある。", "妊娠中の「維持」に一日当たり必要なビタミン量について、ビタミンB1は1.4mgと示されている。", "妊婦の悪心嘔吐時の栄養として、高脂質の食事や栄養剤は気持ち悪さを軽減する可能性があることが知られている。", "2022年にエコチル調査のデータを解析した研究報告で、妊娠第1三半期に妊婦の体重が減少すればするほど、児の出生体重が軽くなることが報告された。"], correctIndex: 3, explanation: "高脂質の食事や栄養剤は気持ち悪さを助長する可能性があることが知られている。" },
          { id: 66, question: "公認スライド「適正な静脈栄養管理における新潮流」の内容について、正しいものを選びなさい。", choices: ["静脈経腸栄養ガイドライン第3版において、「経腸栄養が不可能な場合や、経腸栄養のみでは必要な栄養量を投与できない場合には、静脈栄養の適応となる。」旨の記載がある。", "日本VADコンソーシアムの輸液カテーテル管理の実践基準において、「輸液治療の必要がある患者の輸液治療期間が3か月程度であればPVCを用いる」旨の記載がある。", "PICCは末梢静脈カテーテルの一つである。", "末梢静脈カテーテル留置の際には配合変化や細菌汚染のリスク回避の必要はない。"], correctIndex: 0, explanation: "侵襲性が低い場合の1週間未満の輸液治療が必要な場合にPVCを用いるとしている。PICCは中心静脈カテーテル。末梢静脈カテーテル留置の際にもリスク回避を考慮する。" },
          { id: 67, question: "公認スライド「誤嚥性肺炎における輸液栄養ケアの再考」の内容について、誤っているものを選びなさい。", choices: ["令和2年(2020年)人口動態統計において誤嚥性肺炎は6位の死因であった。", "誤嚥性肺炎患者における経口摂取意欲群と一時的な禁食群を比較した観察研究の結果から、入院後7日までのエネルギー、窒素摂取量は経口摂取意欲群と一時的禁食群で同等であったものの、一時的禁食群で治癒期間の延長が認められた。", "日本における誤嚥性肺炎患者の栄養管理の現状を確認したリアルワールドデータ解析では、入院7日目までに経口摂取を受けた患者は65.1%であることが示された。", "日本における誤嚥性肺炎患者の静脈栄養(熱量・アミノ酸処方量)と予後をみたリアルワールドデータ解析において、熱量の増加と院内死亡の調整オッズ比に関連は認められなかった。"], correctIndex: 1, explanation: "入院後7日までのエネルギー、窒素摂取量で経口摂取意欲群に有意に高い推移を示した。" },
          { id: 68, question: "公認スライド「末梢静脈栄養の適正な活用について」の内容について、誤っているものを選びなさい。", choices: ["2022年のJSPENテキストブックにおいて、末梢静脈栄養は“脂肪乳剤を含む糖電解質を基準とした1500kcal程度のエネルギーを投与する栄養療法”として定義されている。", "FAO/WHOによって示された不可避窒素損失量は54mg/kg/日とされており、アミノ酸に換算すると体重50kgのヒトで26.3g/日となる。", "妊娠悪阻、消化器術後の症例などにおいて、ビタミンB1非併用のPPN療法時にビタミンB1欠乏症が発現したとの報告がある。"], correctIndex: 0, explanation: "JSPENテキストブックにおいてPPNは「1,000kcal前後のエネルギー量を末梢血管から投与する方法」とされている。" },
          { id: 69, question: "公認スライド「慢性維持透析患者に対する静脈栄養管理」の内容について、正しいものを選びなさい。", choices: ["2019年の慢性維持透析患者の年齢別分布推移において、65歳を超える高齢者の割合は年々減少しており、2018年では全体の1/2程度となっている。", "2020年の透析患者に対する静脈栄養ならびに経腸栄養に関する提言において「透析療法に伴うアミノ酸・蛋白の喪失量に関わらず一日必要量以上のアミノ酸投与量を設定する必要がある」旨の記載がある。", "2020年の透析患者に対する静脈栄養ならびに経腸栄養に関する提言において「栄養管理はできる限り経口・経腸で行い、不必要な静脈栄養を安易に行わない」旨の記載がある。", "透析患者の栄養リスクを同定するツールとして、CRP、体重、中性脂肪の指標からなるNRI-JHが開発され、評価に用いられている。"], correctIndex: 2, explanation: "65歳を超える高齢者の割合は年々増加しており2/3を占める。喪失量を考慮して投与量を決定する。NRI-JHはアルブミン、BMI、コレステロール、クレアチニンを用いる。" },
          { id: 70, question: "公認資材「末梢静脈栄養の適正な活用について」の内容について、正しいものを選びなさい。", choices: ["末梢静脈栄養は中心静脈栄養と比べると手技が煩雑である", "栄養ルートの選択アルゴリズムでは、経腸栄養の禁忌に該当する場合では消化管機能が回復しても静脈栄養のみで管理することを示している。", "末梢静脈栄養はルートの頻回な差換えや腕の不自由を生じさせないメリットがある。", "入院高齢者の喫食率は70~80%であるという報告がある。"], correctIndex: 3, explanation: "末梢静脈栄養はTPNと比べると手技が簡便である。消化管機能が回復したら腸を用いる栄養療法を導入する。頻回の差し替えや腕が自由にならない欠点がある。" },
          { id: 71, question: "公認スライド「栄養療法と患者予後の関連」の内容について、誤っているものを選びなさい。", choices: ["ベッド上安静により、1日で約0.5%の除脂肪体重(LBM)が減少するという報告がある。", "低栄養リスク患者への個別的栄養介入の効果を検証した、2019年のEFFORT試験の介入群では、試験期間中のたんぱく質投与量は0.84±0.35g/kgとなっていた。", "EFFORT試験の追跡調査の結果から、介入が終了した後の150日間における生存患者割合で、介入群と対照群との差は認められなかった。", "TPN患者の栄養目標の達成と予後の関連を確認したリアルワールドデータの結果から、栄養管理のターゲットの達成群と一部達成群、非達成群の比較でADLの悪化においては達成群で良好な結果であったが、生存率においては3群に差は認められなかった。"], correctIndex: 3, explanation: "ターゲットの達成群において生存率が高く推移した。" },
          { id: 72, question: "ビスコクリア電子添文について、ビスコクリアをEUSの超音波伝達媒体として使用する場合、内視鏡視野確保のために使用する場合、それぞれの注入量目安を選びなさい。", choices: ["EUS:50~400g 視野確保:200~600g", "EUS:200~600g 視野確保:50~400g", "EUS:600~900g 視野確保:200~600g", "EUS:50~400g 視野確保:600~900g"], correctIndex: 0, explanation: "超音波伝達媒体としての1検査当たりの注入量の目安は50~400gで、内視鏡視野の確保が1処置当たり目安量は200~600gである。" },
          { id: 73, question: "公認資材「ビスコクリアレポート Vol.4」に記載されているGel immersion EMRの特徴として、誤っているものを選びなさい。", choices: ["水に比べ、短時間でGelを貯められる。", "腸液や残渣があっても良好な視野が保たれる。", "切除時の出血に対しても良好な視野で処置を行える。", "Underwater EMRと比べて多岐に渡る病変へ実施できる。", "気泡が入る事がある。"], correctIndex: 3, explanation: "Underwater EMRと比較して適応病変が幅広いわけでは無いが、短時間で病変部に貯める事ができ、良好な視野が確保を保ちやすい。" },
          { id: 74, question: "公認スライド「オラネジン製品紹介」の内容について、正しいものを選びなさい。", choices: ["オラネジンとクロルヘキシジンアルコール製剤を比較した試験である。", "SSI発生率はオラネジン群10.2%、対照群13.0%、p=0.335で有意差はみられなかった。", "主要評価項目は表層切開創SSI発生率である。", "有害事象は紅斑、掻痒、皮膚炎があり、オラネジン群で合計5例であった。"], correctIndex: 3, explanation: "オラネジンとポビドンヨードを比較。SSI発生率はオラネジン群7%、対照群13%、p=0.002で有意差がみられた。主要評価項目は全SSI発生率である。" },
          { id: 75, question: "公認資材「タムガイドレポートVol.1・Vol.2」で、赤色光を体表で確認するためのポイントとして誤っているものを選びなさい。", choices: ["胃内容物の影響を避けるために、栄養剤投与と挿入前に一定の時間を設ける。", "視認性向上のために部屋を暗くする", "胃壁と腹壁が隣接する位置までチューブ先端を余分(従来の挿入長より15~20cm程度)に進める", "胃内でのチューブ操作が必要(抵抗がないことを感じながらゆっくりと大きく出し入れを行う)"], correctIndex: 2, explanation: "従来の挿入長より5~10cm程度である。" },
          { id: 76, question: "公認資材「タムガイドレポートVol.5」で、頸部における気管の走行位置と、経鼻胃管が気道に迷入してしまった場合の頸部での赤色光の見え方について、可能性が高いものを選びなさい。", choices: ["頸部左側に赤色光が強めに透過する", "頸部左側に位置するが光は確認されない", "頸部正中に赤色光が強めに透過する", "頸部右側に位置するが光は確認されない", "頸部正中に位置するが光は確認されない"], correctIndex: 2, explanation: "気管は頸部正中を食道よりも腹側を走行しているので、タムガイドの赤色光は強く見える可能性が高い。" },
          { id: 77, question: "人工呼吸関連肺炎予防バンドル(2010年)に組み込まれているものとして、誤っているものを選びなさい。", choices: ["手指衛生を確実に実施する", "クロルヘキシジングルコン酸塩による口腔ケア", "人工呼吸器回路を頻回に交換しない", "適切な鎮静・鎮痛をはかる", "人工呼吸中の患者を仰臥位で管理しない"], correctIndex: 1, explanation: "日本ではクロルヘキシジングルコン酸塩の粘膜への使用は禁忌となっているため、バンドルに含まれていない。" },
          { id: 78, question: "がん治療法で最も口腔粘膜炎のリスクが高いものを選びなさい。", choices: ["頭頸部化学放射線療法", "自家造血幹細胞移植", "骨髄抑制の強い化学療法", "標準的な化学療法", "頭頸部放射線療法"], correctIndex: 0, explanation: "頭頸部化学放射線療法(97%)、自家造血幹細胞移植(68%)、骨髄抑制の強い化学療法(50%)、標準的な化学療法(15%)、頭頸部放射線療法(50%)と記載されており、①が最もリスクが高い。" },
          { id: 79, question: "正常な排尿とされる記載について、誤っているものを選びなさい。", choices: ["1回の排尿量: 200~400mL", "排尿にかかる時間:10~30秒", "1日の排尿量: 2,000~2,500 mL", "1日の排尿回数:5~7回", "排尿間隔: 3~5時間に1回"], correctIndex: 2, explanation: "1日の排尿量は1,000~1,500mLである。" },
          { id: 80, question: "介助導尿に使用する物品とその処理方法について、正しいものを選びなさい。", choices: ["使い捨て尿器を使用した場合は、内容物を廃棄処理してから本体を粉砕機で処理する", "使い捨て尿器粉砕機の1稼働当たりの所要時間は約10分である", "再利用の尿器を使用した場合、マセレーターと呼ばれる機械で洗浄処理する場合もある。", "再利用の尿器を機械を使用せず洗浄する場合は0.1%クロルヘキシジン液に30分浸漬消毒する", "袋付きカテーテルを使用した場合、感染性廃棄物容器がある施設では、尿を廃棄せずカテーテルごと廃棄する。"], correctIndex: 4, explanation: "使い捨て尿器は排泄物ごと粉砕機に入れる。所要時間は約2分。再利用の尿器を洗浄するのはベッドパンウォッシャー。機械を使用しない場合は0.1%次亜塩素酸ナトリウム液で消毒する。" },
          { id: 81, question: "オーラルフレイルにおける5項目のチェック項目 (OF-5)に該当しないものを選びなさい。", choices: ["口腔乾燥感", "咀嚼困難感", "嚥下困難感", "滑舌低下", "舌圧低下"], correctIndex: 4, explanation: "舌圧低下(低舌圧)は口腔機能低下症の診断項目で、OF-5の項目ではない。正解は「残存歯数減少」である。" },
          { id: 82, question: "重症患者の経腸栄養リスクマネジメントの内容について、誤っているものを選びなさい。", choices: ["WHOの下痢の定義とブリストルスケール7を用いることでICUにおける下痢を定義する事ができる", "ブリストルスケールでは、数字が小さくなるほど、下痢傾向が強くなる(水様便はタイプ1となる)", "経腸栄養時の下痢はICU入室患者では、60~80%程度に発生すると報告されている", "排便量≥350g/日以上はエネルギーおよびタンパクが不足するリスクが高くなる"], correctIndex: 1, explanation: "ブリストルスケールは数字が大きくなるほど、下痢傾向が強くなる(水様便はタイプ7となる)。" },
          { id: 83, question: "Friedらの身体的フレイルの判定基準の5項目について、誤っているものを選びなさい。", choices: ["体重減少", "筋肉量の減少", "主観的疲労感", "日常生活活動量の減少", "身体能力(歩行速度)の減弱"], correctIndex: 1, explanation: "筋肉量の減少ではなく、筋力(握力)の低下である。" },

    function QuizView({ quizData, currentIndex, onNextQuestion, onBack, onJump, bookmarkedIds, onToggleBookmark }) {
      const [selectedIdx, setSelectedIdx] = useState(null);
      const [isAnswered, setIsAnswered] = useState(false);
      
      const total = quizData.questions.length;
      const question = quizData.questions[currentIndex];

      useEffect(() => {
        setSelectedIdx(null);
        setIsAnswered(false);
      }, [currentIndex, question]);

      const handleChoiceClick = (idx) => {
        if (isAnswered) return;
        setSelectedIdx(idx);
        setIsAnswered(true);
      };

      const handleNext = () => {
        const isCorrect = selectedIdx === question.correctIndex;
        onNextQuestion(isCorrect);
      };

      const blocks = [];
      for (let i = 0; i < total; i += 10) {
        const end = Math.min(i + 10, total);
        blocks.push({ label: `Q${i + 1}~Q${end}`, startIndex: i });
      }
      const currentBlockIndex = Math.floor(currentIndex / 10) * 10;

      return (
        <div className="min-h-screen bg-slate-50 py-8 px-4">
          <div className="max-w-3xl mx-auto">
            <button 
              onClick={onBack}
              className="flex items-center gap-1 text-gray-500 hover:text-blue-600 font-bold mb-4 transition-colors"
            >
              <ArrowLeftIcon className="w-5 h-5" /> ポータルへ戻る
            </button>

            <div className="mb-6">
              <div className="flex justify-between items-center mb-2">
                <span className="text-sm font-bold text-gray-500 hidden md:inline">{quizData.title}</span>
                <div className="flex items-center gap-3 ml-auto">
                  <select
                    value={currentBlockIndex}
                    onChange={(e) => onJump(Number(e.target.value))}
                    className="border border-gray-300 rounded-lg text-sm py-1.5 px-3 text-gray-700 bg-white font-medium cursor-pointer hover:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-100 transition-all"
                  >
                    {blocks.map(block => (
                      <option key={block.startIndex} value={block.startIndex}>
                        {block.label}
                      </option>
                    ))}
                  </select>
                  <span className="text-sm font-bold text-gray-500">Q {currentIndex + 1} / {total}</span>
                </div>
              </div>
              <div className="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
                <div 
                  className="bg-blue-600 h-2 rounded-full transition-all duration-500" 
                  style={{ width: `${((currentIndex + 1) / total) * 100}%` }}
                ></div>
              </div>
            </div>

            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">
              <div className="flex justify-between items-start mb-6 gap-4">
                <h2 className="text-lg md:text-xl font-bold text-gray-900 leading-relaxed">
                  {question.question}
                </h2>
                <button 
                  onClick={() => onToggleBookmark(question.id)}
                  className={`flex-shrink-0 p-2 rounded-full transition-colors ${bookmarkedIds.includes(question.id) ? 'bg-orange-50 text-orange-500' : 'text-gray-400 hover:bg-gray-50 hover:text-gray-600'}`}
                  title="付箋（ブックマーク）をつける"
                >
                  <BookmarkIcon solid={bookmarkedIds.includes(question.id)} className="w-6 h-6" />
                </button>
              </div>
              
              <div className="space-y-3 mb-8">
                {question.choices.map((choice, idx) => {
                  const isSelected = selectedIdx === idx;
                  const isCorrectOption = idx === question.correctIndex;
                  
                  let btnClass = "w-full text-left p-4 rounded-xl border-2 transition-all duration-200 font-medium ";
                  
                  if (!isAnswered) {
                    btnClass += isSelected 
                      ? "border-blue-500 bg-blue-50 text-blue-900" 
                      : "border-gray-100 hover:border-blue-200 hover:bg-gray-50 text-gray-700";
                  } else {
                    if (isCorrectOption) {
                      btnClass += "border-green-500 bg-green-50 text-green-900";
                    } else if (isSelected && !isCorrectOption) {
                      btnClass += "border-red-500 bg-red-50 text-red-900";
                    } else {
                      btnClass += "border-gray-100 text-gray-400 opacity-60";
                    }
                  }

                  return (
                    <button 
                      key={idx} 
                      className={btnClass}
                      onClick={() => handleChoiceClick(idx)}
                      disabled={isAnswered}
                    >
                      {choice}
                    </button>
                  );
                })}
              </div>
              
              {isAnswered && (
                <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">
                  <div className={`p-5 rounded-xl mb-6 border-l-4 ${selectedIdx === question.correctIndex ? 'bg-green-50 border-green-500' : 'bg-red-50 border-red-500'}`}>
                    <p className={`font-bold text-lg mb-3 ${selectedIdx === question.correctIndex ? 'text-green-800' : 'text-red-800'}`}>
                      {selectedIdx === question.correctIndex ? '正解！' : '不正解'}
                    </p>
                    <div className="text-sm md:text-base text-gray-800 bg-white/80 p-4 rounded-lg">
                      <span className="font-bold block mb-1">【解説】</span>
                      {question.explanation}
                    </div>
                  </div>
                  <button 
                    className="w-full py-4 bg-blue-600 hover:bg-blue-700 rounded-xl font-bold text-white transition-colors flex items-center justify-center gap-2 text-lg shadow-md hover:shadow-lg"
                    onClick={handleNext}
                  >
                    次へ <ArrowRightIcon />
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

              <CheckCircleIcon />
            </div>
            <h2 className="text-2xl font-bold text-gray-900 mb-3">一区切りです！</h2>
            <p className="text-gray-600 mb-8 leading-relaxed">
              ここまで <span className="font-bold text-blue-600 text-xl">{currentCount}</span> 問完了しました。<br/>
              このまま次の問題へ進むか、<br/>直近の10問をやり直すか選択してください。
            </p>
            
            <div className="space-y-4">
              <button 
                onClick={onContinue}
                className="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold transition-colors shadow-sm"
              >
                次へ進む
              </button>
              <button 
                onClick={onRetry}
                className="w-full py-4 bg-white border-2 border-blue-600 text-blue-600 hover:bg-blue-50 rounded-xl font-bold transition-colors"
              >
                10問前からやり直す
              </button>
            </div>
          </div>
        </div>
      );
    }

    function ResultView({ quizData, answers, onHome }) {
      const correctCount = answers.filter(Boolean).length;
      const totalCount = quizData.questions.length;
      const percentage = Math.round((correctCount / totalCount) * 100);

      return (
        <div className="min-h-screen bg-slate-50 flex items-center justify-center px-4">
          <div className="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center animate-in zoom-in-95 duration-500">
            <h2 className="text-2xl font-bold text-gray-900 mb-2">テスト終了</h2>
            <p className="text-gray-500 mb-8">{quizData.title}</p>
            
            <div className="relative w-40 h-40 mx-auto mb-8">
              <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                <path
                  className="text-gray-100"
                  d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                  fill="none" stroke="currentColor" strokeWidth="3"
                />
                <path
                  className="text-blue-500"
                  strokeDasharray={`${percentage}, 100`}
                  d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                  fill="none" stroke="currentColor" strokeWidth="3"
                  strokeLinecap="round"
                />
              </svg>
              <div className="absolute inset-0 flex flex-col items-center justify-center">
                <span className="text-3xl font-bold text-gray-900">{percentage}%</span>
                <span className="text-xs text-gray-500 font-medium">正答率</span>
              </div>
            </div>
            
            <p className="text-lg font-medium text-gray-700 mb-8">
              {totalCount}問中 <span className="font-bold text-2xl text-blue-600">{correctCount}</span> 問正解
            </p>

            <button 
              onClick={onHome}
              className="w-full py-4 bg-gray-900 hover:bg-gray-800 text-white rounded-xl font-bold transition-colors shadow-sm"
            >
              ポータルへ戻る
            </button>
          </div>
        </div>
      );
    }

    function App() {
      const [currentMode, setCurrentMode] = useState('portal'); // 'portal' | 'quiz' | 'intermission' | 'result'
      const [selectedType, setSelectedType] = useState(null); // 'basic' | 'advance' | 'bookmark'
      const [activeQuizData, setActiveQuizData] = useState(null);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [answers, setAnswers] = useState([]);
      
      const [bookmarkedIds, setBookmarkedIds] = useState(() => {
        try {
          const saved = localStorage.getItem('bookmarkedIds');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          console.error("付箋データの読み込みに失敗しました", e);
          return [];
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem('bookmarkedIds', JSON.stringify(bookmarkedIds));
        } catch (e) {
          console.error("付箋データの保存に失敗しました", e);
        }
      }, [bookmarkedIds]);

      const handleStartTest = (type) => {
        setSelectedType(type);
        setActiveQuizData(QUIZ_DATA[type]);
        setCurrentIndex(0);
        setAnswers([]);
        setCurrentMode('quiz');
      };

      const handleStartBookmarkTest = () => {
        const allQuestions = [...QUIZ_DATA.basic.questions, ...QUIZ_DATA.advance.questions];
        const bookmarkedQuestions = allQuestions.filter(q => bookmarkedIds.includes(q.id));
        
        setSelectedType('bookmark');
        setActiveQuizData({
          title: "付箋（ブックマーク）",
          desc: "ブックマークした問題のみ出題されます。",
          countLabel: `全${bookmarkedQuestions.length}問`,
          questions: bookmarkedQuestions
        });
        setCurrentIndex(0);
        setAnswers([]);
        setCurrentMode('quiz');
      };

      const handleToggleBookmark = (id) => {
        setBookmarkedIds(prev => 
          prev.includes(id) ? prev.filter(bid => bid !== id) : [...prev, id]
        );
      };

      const handleNextQuestion = (isCorrect) => {
        const newAnswers = [...answers, isCorrect];
        setAnswers(newAnswers);
        
        if (currentIndex + 1 >= activeQuizData.questions.length) {
          setCurrentMode('result');
        } else if ((currentIndex + 1) % 10 === 0) {
          setCurrentMode('intermission');
        } else {
          setCurrentIndex(currentIndex + 1);
        }
      };

      const handleIntermissionContinue = () => {
        setCurrentIndex(currentIndex + 1);
        setCurrentMode('quiz');
      };

      const handleIntermissionRetry = () => {
        const rewindIndex = Math.max(0, currentIndex - 9);
        setCurrentIndex(rewindIndex);
        setAnswers(prev => prev.slice(0, rewindIndex));
        setCurrentMode('quiz');
      };

      const handleGoHome = () => {
        setCurrentMode('portal');
        setSelectedType(null);
        setActiveQuizData(null);
      };

      const handleJump = (startIndex) => {
        setCurrentIndex(startIndex);
        setAnswers(new Array(startIndex).fill(null));
        setCurrentMode('quiz');
      };

      return (
        <div className="antialiased text-gray-900 font-sans">
          {currentMode === 'portal' && (
            <PortalView 
              onSelect={handleStartTest} 
              bookmarkCount={bookmarkedIds.length}
              onStartBookmark={handleStartBookmarkTest}
            />
          )}
          
          {currentMode === 'quiz' && activeQuizData && (
            <QuizView 
              quizData={activeQuizData} 
              currentIndex={currentIndex} 
              onNextQuestion={handleNextQuestion} 
              onBack={handleGoHome}
              onJump={handleJump}
              bookmarkedIds={bookmarkedIds}
              onToggleBookmark={handleToggleBookmark}
            />
          )}
          
          {currentMode === 'intermission' && (
            <IntermissionView 
              currentCount={currentIndex + 1}
              onContinue={handleIntermissionContinue} 
              onRetry={handleIntermissionRetry} 
            />
          )}
          
          {currentMode === 'result' && activeQuizData && (
            <ResultView 
              quizData={activeQuizData}
              answers={answers}
              onHome={handleGoHome}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
